[project]
name = "n.e.k.o_plugin_homeassistant"
version = "2.0.0"
description = "N.E.K.O Home Assistant 插件（用自然语言控制全平台智能家居设备）"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"

[plugin]
id = "homeassistant"
name = "Home Assistant 智能家居"
description = "控制 Home Assistant 中的灯光、空调、窗帘、影音与场景（需已有一个在运行的 Home Assistant 实例）"
short_description = "Control lights, climate, covers, media players and scenes in your existing Home Assistant with natural language."
keywords = ["Home Assistant", "(?i)home.?assistant", "(?i)hass", "HA", "智能家居", "(?i)smart.?home", "开灯", "关灯", "空调", "窗帘", "音量", "场景", "(?i)light", "(?i)climate", "(?i)cover", "(?i)media.?player", "(?i)scene"]
version = "1.0.0"
entry = "plugin.plugins.homeassistant:HomeAssistantPlugin"

[plugin.author]
name = "N.E.K.O Team"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "Home Assistant 智能家居"
entry = "static/index.html"
context = "dashboard"
permissions = ["state:read", "action:call"]

[[plugin.ui.guide]]
id = "quickstart"
title = "快速开始"
entry = "docs/quickstart.md"
permissions = ["state:read"]

# 运行时配置（[plugin_runtime]）不在此处定义，见 config.example.toml

[plugin.store]
enabled = false

# 运行时依赖（由 N.E.K.O 主环境提供，无需额外安装）：
# httpx, websockets（可选：缺失时无法读取区域名，自动降级）
